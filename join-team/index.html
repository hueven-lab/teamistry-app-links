<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Open Teamistry</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #000;
        color: #fff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0 auto 1.5rem;
        color: #c7c7cc;
        font-size: 1.05rem;
        line-height: 1.55;
      }

      nav {
        display: grid;
        gap: 0.75rem;
      }

      a {
        min-height: 3rem;
        display: grid;
        place-items: center;
        border: 1px solid #7c4dff;
        border-radius: 0.875rem;
        color: #fff;
        text-decoration: none;
        font-weight: 650;
      }

      a:focus-visible {
        outline: 3px solid #82b1ff;
        outline-offset: 3px;
      }
    </style>
    <script>
      (function () {
        var userAgent = navigator.userAgent || "";
        var iosStore =
          "https://apps.apple.com/hk/app/teamistry-club/id6749819182";
        var androidStore =
          "https://play.google.com/store/apps/details?id=com.huevenlab.teamistryapp";

        if (/iPhone|iPad|iPod/i.test(userAgent)) {
          window.location.replace(iosStore);
          return;
        }

        if (/Android/i.test(userAgent)) {
          window.location.replace(androidStore);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Open Teamistry</h1>
      <p>
        Open this invitation on your phone. If Teamistry is not installed,
        install it below and ask for a fresh invitation link.
      </p>
      <nav aria-label="Download Teamistry">
        <a href="https://apps.apple.com/hk/app/teamistry-club/id6749819182"
          >Download for iPhone</a
        >
        <a
          href="https://play.google.com/store/apps/details?id=com.huevenlab.teamistryapp"
          >Download for Android</a
        >
      </nav>
      <noscript>
        <p>JavaScript is not required to use the store links above.</p>
      </noscript>
    </main>
  </body>
</html>
